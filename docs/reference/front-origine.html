adius:9px;border:1px solid #DDD6C9;background:#FFFFFF;color:#141210;font-size:13px;font-weight:500;cursor:pointer\">Fiche vérifiée<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ a.suppr }}\" title=\"Retire cet athlète de la liste des engagés\" style=\"margin-left:auto;padding:9px 14px;border-radius:9px;border:1px solid #E9CFC4;background:#FFFFFF;color:#A6371C;font-size:13px;cursor:pointer\">Retirer l'athlète<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:24px;background:#FFFFFF;border:1px solid #E7E1D6;border-radius:14px;padding:18px 20px\">\n            <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:4px\">Logos des clubs<\u002Fdiv>\n            <div style=\"font-size:13px;color:#6E675C;line-height:1.45;margin-bottom:14px\">Un logo par club engagé. Il s'affiche près du nom de l'athlète sur les écrans du public.<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px\">\n              <sc-for list=\"{{ clubs }}\" as=\"cl\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;gap:12px;align-items:center;border:1px solid #E7E1D6;border-radius:11px;padding:12px\">\n                  <div style=\"width:46px;height:46px;border-radius:8px;border:1px solid #DDD6C9;background-color:#F5F1E8;background-image:{{ cl.logo }};background-size:contain;background-position:center;background-repeat:no-repeat;flex:none\"><\u002Fdiv>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"font-size:14px;font-weight:600\">{{ cl.nom }}<\u002Fdiv>\n                    <div style=\"font-size:12px;color:#8A8378\">{{ cl.effectif }}<\u002Fdiv>\n                    <label title=\"Choisir l'image du logo\" style=\"display:inline-block;margin-top:5px;font-size:12px;color:#0B9237;cursor:pointer\">Choisir un logo\n                      <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ cl.setLogo }}\" style=\"display:none\">\n                    <\u002Flabel>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ aucunClub }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:13px;color:#8A8378\">Aucun club renseigné pour l'instant.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ etape4 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"font-size:22px;font-weight:700;text-transform:uppercase;margin-bottom:6px\">Pesée <span style=\"color:#EC6D23\">et vérification<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;color:#4A443B;line-height:1.55;max-width:760px;margin-bottom:22px;text-wrap:pretty\">14h00 — 15h00 : accueil, pesée, vérification des équipements. La validation attribue le groupe et le dossard, puis verrouille la ligne.<\u002Fdiv>\n\n          <div style=\"background:#FFFFFF;border:1px solid #E7E1D6;border-radius:14px;overflow:hidden\">\n            <sc-for list=\"{{ pesee }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div style=\"padding:14px 18px;border-top:1px solid #F0EBE1\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end\">\n                  <div style=\"display:flex;gap:10px;align-items:center;flex:2 1 220px;min-width:180px\">\n                    <input value=\"{{ p.dossardSaisi }}\" sc-camel-on-change=\"{{ p.setDossard }}\" disabled=\"{{ p.verrou }}\" placeholder=\"—\" title=\"Numéro de dossard, saisi à la main\" style=\"width:52px;padding:7px 6px;border:1px solid #DDD6C9;border-radius:7px;background:{{ p.champFond }};font-size:16px;font-weight:700;text-align:center;color:{{ p.dossardCouleur }};flex:none;outline:none\">\n                    <div style=\"min-width:0\">\n                      <div style=\"font-size:15px;font-weight:600;line-height:1.25\">{{ p.nomComplet }}<\u002Fdiv>\n                      <div style=\"font-size:13px;color:#8A8378\">{{ p.sousTitre }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:1 1 110px;min-width:100px\">\n                    <div style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#8A8378;margin-bottom:5px\">Poids (kg)<\u002Fdiv>\n                    <input value=\"{{ p.poids }}\" sc-camel-on-change=\"{{ p.setPoids }}\" title=\"Poids relevé à la bascule. La catégorie est déduite automatiquement.\" disabled=\"{{ p.verrou }}\" placeholder=\"—\" style=\"width:100%;padding:9px 11px;border:1px solid #DDD6C9;border-radius:8px;background:{{ p.champFond }};font-size:15px;font-weight:600;outline:none\">\n                  <\u002Fdiv>\n                  <div style=\"flex:2 1 190px;min-width:160px\">\n                    <div style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#8A8378;margin-bottom:5px\">Catégorie<\u002Fdiv>\n                    <sc-raw-select value=\"{{ p.categorieId }}\" sc-camel-on-change=\"{{ p.setCategorie }}\" disabled=\"{{ p.verrou }}\" title=\"Catégorie de l'athlète. Laissée vide, elle est déduite du poids pesé.\" style=\"width:100%;padding:9px 11px;border:1px solid #DDD6C9;border-radius:8px;background:{{ p.champFond }};font-size:14px;outline:none\">\n                      <option value=\"\">— Déduite du poids —<\u002Foption>\n                      <sc-for list=\"{{ categoriesOptions }}\" as=\"co\" hint-placeholder-count=\"2\">\n                        <option value=\"{{ co.id }}\">{{ co.nom }}<\u002Foption>\n                      <\u002Fsc-for>\n                      <option value=\"hors\">Indépendant — hors classement<\u002Foption>\n                    <\u002Fsc-raw-select>\n                  <\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ p.basculer }}\" title=\"Valider affecte la catégorie, attribue le dossard et verrouille la ligne. Déverrouiller permet de corriger une erreur de pesée.\" style=\"flex:1 1 140px;min-width:130px;padding:11px 13px;border-radius:8px;border:1px solid {{ p.btnBord }};background:{{ p.btnFond }};color:{{ p.btnEncre }};font-size:13px;font-weight:600;cursor:pointer\">{{ p.btnTexte }}<\u002Fbutton>\n                <\u002Fdiv>\n                <sc-if value=\"{{ p.erreur }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-top:10px;padding:10px 12px;border-radius:9px;background:#FBEFEA;border:1px solid #E9CFC4;color:#A6371C;font-size:13px;line-height:1.45;font-weight:600;text-wrap:pretty\">{{ p.erreur }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:16px;font-size:13px;color:#8A8378\">{{ resumePesee }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ etape5 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"font-size:22px;font-weight:700;text-transform:uppercase;margin-bottom:6px\">Programme <span style=\"color:#EC6D23\">de la journée<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;color:#4A443B;line-height:1.55;max-width:760px;margin-bottom:22px;text-wrap:pretty\">Jour unique. Ce programme alimente l'écran d'attente du mur LED et la fiche du speaker.<\u002Fdiv>\n\n          <div style=\"background:#FFFFFF;border:1px solid #E7E1D6;border-radius:14px;padding:8px 18px 18px\">\n            <sc-for list=\"{{ programme }}\" as=\"pr\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #F0EBE1\">\n                <div style=\"flex:none;width:96px\">\n                  <input value=\"{{ pr.h }}\" sc-camel-on-change=\"{{ pr.setH }}\" title=\"Heure affichée sur l'écran d'attente et la fiche du speaker\" style=\"width:100%;padding:8px 10px;border:1px solid #DDD6C9;border-radius:8px;background:#FCFAF6;font-size:15px;font-weight:700;color:#03562A;outline:none\">\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <input value=\"{{ pr.txt }}\" sc-camel-on-change=\"{{ pr.setTxt }}\" title=\"Intitulé du moment : accueil, briefing, épreuve, remise des récompenses\" style=\"width:100%;padding:8px 10px;border:1px solid #DDD6C9;border-radius:8px;background:#FCFAF6;font-size:15px;outline:none\">\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ pr.suppr }}\" title=\"Retire cette ligne du programme\" style=\"flex:none;padding:8px 12px;border-radius:8px;border:1px solid #E9CFC4;background:#FFFFFF;color:#A6371C;font-size:13px;cursor:pointer\">Retirer<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <button sc-camel-on-click=\"{{ ajouterProgramme }}\" title=\"Ajoute un moment au programme de la journée\" style=\"margin-top:16px;padding:11px 18px;border-radius:10px;border:1px dashed #B8B0A2;background:#FFFFFF;color:#03562A;font-size:14px;font-weight:600;cursor:pointer\">+ Ajouter une ligne<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:20px;background:#FFFFFF;border:1px solid #E7E1D6;border-radius:14px;padding:18px 20px\">\n            <div style=\"font-size:16px;font-weight:700;margin-bottom:4px\">Récompenses<\u002Fdiv>\n            <div style=\"font-size:13px;color:#6E675C;line-height:1.5;margin-bottom:14px;text-wrap:pretty\">Titre, prime et lot de chaque place. Ce que vous écrivez ici s'affiche sur l'écran Podium et figure au procès-verbal. Modifiable à tout moment, même pendant la compétition.<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ recompenses }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px;border:1px solid #E7E1D6;border-left:5px solid {{ r.couleur }};border-radius:11px\">\n                  <div style=\"flex:none;width:80px;font-size:14px;font-weight:700;color:{{ r.couleur }}\">{{ r.libRang }}<\u002Fdiv>\n                  <input value=\"{{ r.titre }}\" sc-camel-on-change=\"{{ r.setTitre }}\" placeholder=\"Médaille d'or\" title=\"Intitulé de la distinction\" style=\"flex:2 1 170px;min-width:140px;padding:9px 11px;border:1px solid #DDD6C9;border-radius:8px;background:#FCFAF6;font-size:14px;outline:none\">\n                  <input value=\"{{ r.prime }}\" sc-camel-on-change=\"{{ r.setPrime }}\" placeholder=\"500 000 fr\" title=\"Prime en espèces annoncée sur l'écran Podium\" style=\"flex:1 1 130px;min-width:110px;padding:9px 11px;border:1px solid #DDD6C9;border-radius:8px;background:#FCFAF6;font-size:14px;font-weight:700;color:#03562A;outline:none\">\n                  <input value=\"{{ r.lot }}\" sc-camel-on-change=\"{{ r.setLot }}\" placeholder=\"Trophée, dotation…\" title=\"Lot en nature, facultatif\" style=\"flex:2 1 170px;min-width:140px;padding:9px 11px;border:1px solid #DDD6C9;border-radius:8px;background:#FCFAF6;font-size:14px;outline:none\">\n                  <button sc-camel-on-click=\"{{ r.suppr }}\" title=\"Retire cette récompense\" style=\"flex:none;padding:9px 13px;border-radius:8px;border:1px solid #E9CFC4;background:#FFFFFF;color:#A6371C;font-size:13px;cursor:pointer\">Retirer<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:14px\">\n              <button sc-camel-on-click=\"{{ ajouterRecompense }}\" title=\"Ajoute une place récompensée\" style=\"padding:11px 18px;border-radius:10px;border:1px dashed #B8B0A2;background:#FFFFFF;color:#03562A;font-size:14px;font-weight:600;cursor:pointer\">+ Ajouter une récompense<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ retablirRecompenses }}\" title=\"Revient aux trois médailles et primes officielles\" style=\"padding:11px 18px;border-radius:10px;border:1px solid #DDD6C9;background:#FFFFFF;color:#6E675C;font-size:14px;font-weight:500;cursor:pointer\">Rétablir les valeurs officielles<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:20px;background:#FFFFFF;border:1px solid #E7E1D6;border-radius:14px;padding:18px 20px\">\n            <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:8px\">Bandeau partenaires<\u002Fdiv>\n            <input value=\"{{ partenaires }}\" sc-camel-on-change=\"{{ setPartenaires }}\" title=\"Noms défilant sur l'écran d'attente et entre les passages\" placeholder=\"Noms séparés par des virgules\" style=\"width:100%;padding:10px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;font-size:15px;outline:none\">\n            <div style=\"font-size:13px;color:#8A8378;margin-top:7px;line-height:1.45\">Affiché sur l'écran d'attente et entre les passages.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex;gap:10px;margin-top:30px;padding-top:20px;border-top:1px solid #E7E1D6;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ etapePrec }}\" title=\"Revenir à l'étape précédente ; la saisie est conservée\" style=\"padding:12px 20px;border-radius:10px;border:1px solid #DDD6C9;background:#FFFFFF;color:#141210;font-size:14px;font-weight:500;cursor:pointer\">Étape précédente<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ etapeSuiv }}\" title=\"Passer à l'étape suivante ; la saisie est conservée\" style=\"padding:12px 20px;border-radius:10px;border:none;background:#0B9237;color:#FFFFFF;font-size:14px;font-weight:600;cursor:pointer\">{{ libSuivant }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ estRecap }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div style=\"font-size:22px;font-weight:700;text-transform:uppercase;margin-bottom:6px\">Récapitulatif <span style=\"color:#EC6D23\">de préparation<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:15px;color:#4A443B;line-height:1.55;max-width:760px;margin-bottom:22px;text-wrap:pretty\">Ce qui est prêt, ce qui manque. Rien n'empêche de lancer la compétition avec des lignes incomplètes, mais chaque manque est signalé ici.<\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ recap }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;gap:14px;align-items:center;background:#FFFFFF;border:1px solid #E7E1D6;border-left:4px solid {{ r.couleur }};border-radius:12px;padding:15px 18px\">\n            <div style=\"display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:999px;background:{{ r.pucefond }};color:{{ r.couleur }};font-size:14px;font-weight:700;flex:none\">{{ r.signe }}<\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:16px;font-weight:600\">{{ r.titre }}<\u002Fdiv>\n              <div style=\"font-size:14px;color:#6E675C;line-height:1.45\">{{ r.detail }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ r.aller }}\" title=\"Ouvre l'étape concernée pour compléter ce point\" style=\"flex:none;padding:9px 14px;border-radius:9px;border:1px solid #DDD6C9;background:#FCFAF6;color:#141210;font-size:13px;font-weight:500;cursor:pointer\">Ouvrir<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:26px;padding:20px;border-radius:14px;background:linear-gradient(100deg,#EC6D23,#BC4F14);color:#FFFFFF\">\n        <div style=\"font-size:19px;font-weight:700;margin-bottom:4px\">{{ verdictRecap }}<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.5;opacity:.92\">{{ verdictDetail }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ estPlateau }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;background:#FFFFFF;border:1px solid #E7E1D6;border-radius:14px;padding:16px 18px;margin-bottom:18px\">\n        <div style=\"flex:1;min-width:200px\">\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Épreuve en cours<\u002Fdiv>\n          <sc-raw-select value=\"{{ epreuveCouranteId }}\" sc-camel-on-change=\"{{ setEpreuveCourante }}\" title=\"Épreuve dont on gère le plateau\" style=\"width:100%;padding:10px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;font-size:15px;font-weight:600;outline:none\">\n            <sc-for list=\"{{ epreuves }}\" as=\"e\" hint-placeholder-count=\"5\">\n              <option value=\"{{ e.id }}\">{{ e.nom }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:200px\">\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Passage<\u002Fdiv>\n          <sc-raw-select value=\"{{ groupeCourantId }}\" sc-camel-on-change=\"{{ setGroupeCourant }}\" title=\"Par groupe de poids, ou tout le monde mélangé. Les classements restent séparés.\" style=\"width:100%;padding:10px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;font-size:15px;font-weight:600;outline:none\">\n            <sc-for list=\"{{ groupesPlateau }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <option value=\"{{ g.id }}\">{{ g.nom }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ construireFile }}\" title=\"Reconstruit la liste À venir de cette épreuve dans l'ordre des dossards\" style=\"padding:11px 18px;border-radius:10px;border:1px solid #DDD6C9;background:#FCFAF6;color:#141210;font-size:14px;font-weight:600;cursor:pointer\">Reconstruire l'ordre<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ preparerToutes }}\" title=\"Charge tous les athlètes dans toutes les épreuves d'un coup, par catégorie et toutes catégories mélangées. Les ordres déjà construits ne sont pas touchés.\" style=\"padding:11px 18px;border-radius:10px;border:none;background:#141210;color:#FFFFFF;font-size:14px;font-weight:600;cursor:pointer\">Précharger toutes les épreuves<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ versRegie }}\" title=\"Raccourci vers la régie : changer ce qu'affichent les écrans géants sans quitter le plateau\" style=\"padding:11px 18px;border-radius:10px;border:1px solid #EC6D23;background:#FFF6E8;color:#BC4F14;font-size:14px;font-weight:700;cursor:pointer\">Régie des écrans<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ suspendre }}\" title=\"Interrompt la compétition et l'affiche sur les écrans publics\" style=\"padding:11px 18px;border-radius:10px;border:1px solid #E9CFC4;background:#FFFFFF;color:#A6371C;font-size:14px;font-weight:600;cursor:pointer\">Suspendre<\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ epreuveANiveaux }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-bottom:18px;padding:13px 16px;border-radius:11px;background:#FFF6E8;border:1px solid #F0D8B0;border-left:4px solid #E8A317;color:#8A5A0B;font-size:13px;line-height:1.5;font-weight:600;text-wrap:pretty\">{{ messageNiveaux }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ estMedleyCourant }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-bottom:18px;padding:14px 16px;border-radius:11px;background:#FFFFFF;border:1px solid #E7E1D6\">\n          <div style=\"display:flex;gap:10px;align-items:baseline;margin-bottom:10px\">\n            <div style=\"font-size:14px;font-weight:700\">Medley — ateliers dans l'ordre<\u002Fdiv>\n            <div style=\"font-size:13px;color:#EC6D23;font-weight:700\">{{ distanceMedley }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <sc-for list=\"{{ ateliersCourants }}\" as=\"at\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:9px;background:#F5F1E8\">\n                <span style=\"display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:999px;background:#141210;color:#FCFAF6;font-size:12px;font-weight:700;flex:none\">{{ at.num }}<\u002Fspan>\n                <span style=\"font-size:13px;font-weight:600\">{{ at.txt }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ msgPreparation }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-bottom:18px;padding:12px 16px;border-radius:11px;background:rgba(11,146,55,.07);border:1px solid rgba(11,146,55,.18);color:#03562A;font-size:13px;line-height:1.5;font-weight:600\">{{ msgPreparation }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ suspendu }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:14px;align-items:center;background:#FFF6E8;border:1px solid #F0D8B0;border-left:4px solid #E8A317;border-radius:12px;padding:14px 18px;margin-bottom:18px\">\n          <div style=\"flex:1;font-size:15px;font-weight:600;color:#8A5A0B\">Compétition suspendue — {{ motifSuspension }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ reprendre }}\" title=\"Reprendre la compétition\" style=\"padding:9px 16px;border-radius:9px;border:none;background:#0B9237;color:#FFFFFF;font-size:14px;font-weight:600;cursor:pointer\">Reprendre<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ melange }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#FFFFFF;border:2px solid #141210;border-radius:14px;padding:16px 18px;margin-bottom:18px\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6E675C;margin-bottom:12px\">Appel — un athlète par catégorie<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px\">\n            <sc-for list=\"{{ ordreCats }}\" as=\"c\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;gap:12px;align-items:center;border:1px solid #E7E1D6;border-left:5px solid {{ c.couleur }};border-radius:11px;padding:12px 14px\">\n                <div style=\"font-size:20px;font-weight:700;color:{{ c.couleur }};flex:none\">{{ c.prochainDossard }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A8378\">{{ c.nom }}<\u002Fdiv>\n                  <div style=\"font-size:16px;font-weight:600;line-height:1.2\">{{ c.prochainNom }}<\u002Fdiv>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ c.appelerProchain }}\" title=\"Appelle cet athlète au plateau\" style=\"padding:9px 14px;border-radius:9px;border:none;background:#141210;color:#FFFFFF;font-size:13px;font-weight:600;cursor:pointer;flex:none\">Appeler<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start\">\n\n        <div style=\"background:#FFFFFF;border:1px solid #E7E1D6;border-radius:14px;overflow:hidden\">\n          <div style=\"padding:13px 18px;background:#F5F1E8;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6E675C\">À venir · {{ nbAvenir }}<\u002Fdiv>\n          <sc-for list=\"{{ avenir }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid #F0EBE1\">\n              <div style=\"width:34px;height:34px;border-radius:8px;background:#F0EBE1;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#6E675C;flex:none\">{{ p.dossard }}<\u002Fdiv>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-size:15px;font-weight:600;line-height:1.25\">{{ p.nom }}<\u002Fdiv>\n                <div style=\"display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:3px\">\n                  <span style=\"padding:2px 8px;border-radius:999px;background:{{ p.catCouleur }};color:#FFFFFF;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase\">{{ p.categorie }}<\u002Fspan>\n                  <sc-if value=\"{{ p.aNiveau }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"padding:2px 8px;border-radius:999px;background:#FFF6E8;border:1px solid #F0D8B0;color:#8A5A0B;font-size:11px;font-weight:700\">{{ p.niveau }}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <span style=\"font-size:13px;color:#8A8378\">{{ p.clubMention }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ p.appeler }}\" title=\"Appelle cet athlète au plateau\" style=\"padding:8px 13px;border-radius:8px;border:none;background:#141210;color:#FFFFFF;font-size:13px;font-weight:600;cursor:pointer;flex:none\">Appeler<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ aucunAvenir }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:20px 18px;font-size:14px;color:#8A8378;line-height:1.5\">Aucun passage en attente. Construisez l'ordre de passage pour cette épreuve.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"background:#FFFFFF;border:2px solid #141210;border-radius:14px;overflow:hidden\">\n          <div style=\"padding:13px 18px;background:#141210;color:#FCFAF6;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase\">{{ libPlateau }}<\u002Fdiv>\n          <div style=\"padding:18px\">\n            <sc-if value=\"{{ melange }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ appelerDuo }}\" title=\"Appelle en une fois le prochain athlète de chaque catégorie : les deux passages s'ouvrent côte à côte, ici et sur le mur LED\" style=\"width:100%;margin-bottom:14px;padding:14px;border-radius:11px;border:none;background:#141210;color:#FFFFFF;font-size:15px;font-weight:700;cursor:pointer\">{{ libAppelerDuo }}<\u002Fbutton>\n            <\u002Fsc-if>\n\n            <div style=\"padding:14px;border-radius:12px;background:#0A0D0B;text-align:center;border:2px solid {{ chronoEncadre }}\">\n              <div style=\"font-size:44px;font-weight:700;color:{{ chronoCouleurClair }};line-height:1;font-variant-numeric:tabular-nums;animation:{{ chronoAnim }}\">{{ chronoTexte }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:#9AA79E;margin-top:6px\">{{ chronoEtat }}<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ chronoAction }}\" title=\"Premier appui : démarrer à l'annonce officielle. Second appui : arrêter au commencement réglementaire de l'essai. Impossible tant qu'aucun athlète n'est au plateau.\" style=\"width:100%;margin-top:12px;padding:16px;border-radius:11px;border:none;background:{{ chronoFond }};color:#FFFFFF;font-size:17px;font-weight:700;cursor:pointer\">{{ chronoLibelle }}<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ msgChrono }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:10px;padding:11px 13px;border-radius:9px;background:#FBEFEA;border:1px solid #E9CFC4;color:#A6371C;font-size:13px;font-weight:600;line-height:1.45\">{{ msgChrono }}<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"margin-top:14px;border-left:3px solid #EC6D23;padding:8px 0 8px 12px;font-size:13px;line-height:1.45;color:#4A443B\">{{ critereCourant }}<\u002Fdiv>\n\n            <sc-if value=\"{{ plateauVide }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:14px;padding:14px;border-radius:11px;background:#F5F1E8;font-size:14px;color:#8A8378;line-height:1.5\">Appelez un athlète depuis la liste À venir : son passage quittera cette liste et deviendra visible ici.<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-for list=\"{{ plateaux }}\" as=\"auPlateau\" hint-placeholder-count=\"1\">\n              <div style=\"margin-top:14px;border:1px solid #E7E1D6;border-top:4px solid {{ auPlateau.catCouleur }};border-radius:12px;padding:14px\">\n              <div style=\"display:flex;gap:14px;align-items:flex-start\">\n                <div style=\"width:84px;height:100px;border-radius:9px;border:1px solid #DDD6C9;background-color:#F5F1E8;background-image:{{ auPlateau.photoBg }};background-size:cover;background-position:center;background-repeat:no-repeat;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#8A8378;flex:none;overflow:hidden\">\n                  <sc-if value=\"{{ auPlateau.sansPhoto }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div>{{ auPlateau.initiales }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"display:flex;gap:8px;align-items:center;margin-bottom:4px\">\n                    <span style=\"display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 7px;border-radius:7px;background:#EC6D23;color:#FFFFFF;font-size:14px;font-weight:700\">{{ auPlateau.dossard }}<\u002Fspan>\n                    <span style=\"display:flex;width:22px;height:15px;border:1px solid #DDD6C9;overflow:hidden;flex:none\">\n                      <span style=\"flex:1;background:{{ auPlateau.d1 }}\"><\u002Fspan>\n                      <span style=\"flex:1;background:{{ auPlateau.d2 }}\"><\u002Fspan>\n                      <span style=\"flex:1;background:{{ auPlateau.d3 }}\"><\u002Fspan>\n                    <\u002Fspan>\n                    <span style=\"font-size:13px;color:#8A8378\">{{ auPlateau.paysNom }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:{{ auPlateau.catCouleur }};color:#FFFFFF;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px\">{{ auPlateau.categorie }}<\u002Fdiv>\n                  <div style=\"font-size:21px;font-weight:700;line-height:1.15\">{{ auPlateau.nom }}<\u002Fdiv>\n                  <div style=\"font-size:14px;color:#6E675C\">{{ auPlateau.club }} · {{ auPlateau.poidsTexte }}<\u002Fdiv>\n                  <sc-if value=\"{{ auPlateau.aNiveau }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:inline-flex;margin-top:6px;padding:4px 10px;border-radius:8px;background:#FFF6E8;border:1px solid #F0D8B0;color:#8A5A0B;font-size:13px;font-weight:700\">{{ auPlateau.niveau }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"font-size:13px;color:#8A8378;margin-top:5px;line-height:1.4\">{{ auPlateau.note }}<\u002Fdiv>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ auPlateau.renvoyer }}\" title=\"Erreur d'appel : remet cet athlète dans la liste À venir, sans résultat\" style=\"flex:none;padding:8px 12px;border-radius:9px;border:1px solid #E9CFC4;background:#FFFFFF;color:#A6371C;font-size:13px;font-weight:600;cursor:pointer\">← Retour file<\u002Fbutton>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ auPlateau.toursActifs }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:14px;padding:12px;border-radius:11px;background:#0A0D0B\">\n                  <button sc-camel-on-click=\"{{ auPlateau.tour }}\" title=\"Un appui à chaque répétition validée de cet athlète : pierre chargée, pneu renversé, levée verrouillée. Le compteur et le temps du dernier tour se remplissent tout seuls.\" style=\"width:100%;padding:15px;border-radius:10px;border:1.5px solid #FCFAF6;background:transparent;color:#FCFAF6;font-size:16px;font-weight:700;cursor:pointer\">Tour — répétition validée<\u002Fbutton>\n                  <div style=\"display:flex;gap:10px;align-items:center;margin-top:10px\">\n                    <div style=\"flex:1;font-size:12px;color:#9AA79E\">{{ auPlateau.nbTours }}<\u002Fdiv>\n                    <sc-if value=\"{{ auPlateau.aDesTours }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button sc-camel-on-click=\"{{ auPlateau.annulerTour }}\" title=\"Retire le dernier tour compté pour cet athlète\" style=\"flex:none;padding:6px 11px;border-radius:7px;border:1px solid rgba(252,250,246,.4);background:transparent;color:#FCFAF6;font-size:12px;font-weight:600;cursor:pointer\">Retirer le dernier<\u002Fbutton>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:8px\">\n                    <sc-for list=\"{{ auPlateau.tours }}\" as=\"lp\" hint-placeholder-count=\"0\">\n                      <span style=\"padding:4px 9px;border-radius:7px;background:rgba(252,250,246,.12);color:#FCFAF6;font-size:12px;font-weight:600\">{{ lp.num }} · {{ lp.t }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px;align-items:end\">\n                <div>\n                  <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px;min-height:16px\">{{ auPlateau.uniteValeur }}<\u002Fdiv>\n                  <input value=\"{{ auPlateau.valeur }}\" sc-camel-on-change=\"{{ auPlateau.setValeur }}\" title=\"Performance mesurée sur cet essai\" style=\"width:100%;padding:11px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;font-size:17px;font-weight:700;outline:none\">\n                <\u002Fdiv>\n                <sc-if value=\"{{ auPlateau.mixte }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div>\n                    <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px;min-height:16px\">{{ auPlateau.libTemps }}<\u002Fdiv>\n                    <input value=\"{{ auPlateau.temps }}\" sc-camel-on-change=\"{{ auPlateau.setTemps }}\" title=\"Temps total, sert à départager les égalités\" style=\"width:100%;padding:11px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;font-size:17px;font-weight:700;outline:none\">\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ auPlateau.erreur }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:10px;padding:10px 12px;border-radius:9px;background:#FBEFEA;border:1px solid #E9CFC4;color:#A6371C;font-size:13px;font-weight:600;line-height:1.45\">{{ auPlateau.erreur }}<\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid #F0EBE1\">\n                <button sc-camel-on-click=\"{{ auPlateau.officialiser }}\" title=\"Enregistre la performance saisie par la table, met à jour le classement et appelle automatiquement l'athlète suivant\" style=\"flex:1;min-width:100%;padding:16px;border-radius:11px;border:none;background:#0B9237;color:#FFFFFF;font-size:16px;font-weight:700;cursor:pointer\">Valider la performance et appeler le suivant<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ auPlateau.zero }}\" title=\"Essai nul : l'athlète a bien concouru mais aucune performance n'est validée (pierre non posée, levée non verrouillée, sortie de zone). Il reste classé dans l'épreuve avec 0 point, contrairement au forfait où il ne se présente pas.\" style=\"padding:13px 15px;border-radius:10px;border:1px solid #DDD6C9;background:#FCFAF6;color:#141210;font-size:14px;font-weight:600;cursor:pointer\">Zéro<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ auPlateau.forfait }}\" title=\"Forfait de l'athlète sur cette épreuve\" style=\"padding:13px 15px;border-radius:10px;border:1px solid #DDD6C9;background:#FCFAF6;color:#141210;font-size:14px;font-weight:600;cursor:pointer\">Forfait<\u002Fbutton>\n              <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ annulationOuverte }}\" hint-placeholder-val=\"{{ true }}\">\n              <button sc-camel-on-click=\"{{ retourPassage }}\" title=\"Annule la dernière validation : l'athlète précédent revient au plateau, sa performance est effacée\" style=\"width:100%;margin-top:14px;padding:12px;border-radius:10px;border:1px solid #E9CFC4;background:#FFFFFF;color:#A6371C;font-size:14px;font-weight:600;cursor:pointer\">← Annuler la dernière validation<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ annulationVerrouillee }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:14px;padding:12px 14px;border-radius:10px;background:#F5F1E8;border:1px solid #DDD6C9;color:#6E675C;font-size:13px;line-height:1.45;font-weight:600;text-wrap:pretty\">Épreuve terminée pour cette catégorie : l'annulation est verrouillée. Une correction passe désormais par la feuille de notation et la signature du juge principal.<\u002Fdiv>\n            <\u00 ext-transform:uppercase;color:#6E675C;margin-bottom:12px\">Ordre de passage par catégorie — mis à jour à chaque validation<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px\">\n            <sc-for list=\"{{ ordreCats }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div style=\"background:#FFFFFF;border:1px solid #E7E1D6;border-radius:14px;overflow:hidden\">\n                <div style=\"padding:11px 16px;background:{{ c.couleur }};color:#FFFFFF;display:flex;gap:10px;align-items:baseline\">\n                  <div style=\"flex:1;min-width:0;font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase\">{{ c.nom }}<\u002Fdiv>\n                  <div style=\"font-size:12px;opacity:.9\">{{ c.compte }}<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ c.liste }}\" as=\"p\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid #F0EBE1;background:{{ p.fondClair }}\">\n                    <div style=\"width:22px;font-size:13px;font-weight:700;color:#8A8378;flex:none\">{{ p.rangCat }}<\u002Fdiv>\n                    <div style=\"width:32px;height:30px;border-radius:7px;background:#F0EBE1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#4A443B;flex:none\">{{ p.dossard }}<\u002Fdiv>\n                    <div style=\"flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.2\">{{ p.nom }}<\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ p.appeler }}\" title=\"Appeler cet athlète au plateau maintenant\" style=\"padding:6px 10px;border-radius:8px;border:1px solid #DDD6C9;background:#FCFAF6;color:#141210;font-size:12px;font-weight:600;cursor:pointer;flex:none\">Appeler<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002F
