    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

        }
      }

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');

      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

in:0;background:#FCFAF6;color:#141210;font-family:'Clash Display','Barlow Condensed',system-ui,sans-serif;-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\na{color:#0B9237;text-decoration:none}\na:hover{color:#03562A;text-decoration:underline}\ninput,select,textarea,button{font-family:inherit}\n@keyframes clignote{0%,49%{opacity:1}50%,100%{opacity:.2}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:1180px;margin:0 auto;padding:0 20px 80px\">\n\n<sc-if value=\"{{ pasSolo }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n  <sc-if value=\"{{ espaceEssai }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;gap:12px;align-items:center;margin-top:20px;padding:11px 18px;border-radius:12px;background:#EC6D23;color:#FFFFFF\">\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase\">Mode démonstration — rien de ce qui est ici ne compte<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ chargerDemo }}\" title=\"Remplit la démonstration avec des athlètes fictifs pour s'entraîner\" style=\"margin-left:auto;padding:7px 13px;border-radius:8px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#FFFFFF;font-size:13px;font-weight:600;cursor:pointer\">{{ libDemo }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ viderDemo }}\" title=\"Efface tout ce qui a été saisi ou importé dans la démonstration. La compétition réelle n'est pas touchée.\" style=\"padding:7px 13px;border-radius:8px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#FFFFFF;font-size:13px;font-weight:600;cursor:pointer\">Vider la démo<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ versModeReel }}\" title=\"Revenir à la compétition réelle\" style=\"padding:7px 13px;border-radius:8px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.14);color:#FFFFFF;font-size:13px;font-weight:600;cursor:pointer\">Compétition réelle<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ demandeOuverte }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1180px;margin:16px auto 0;padding:0 20px\">\n      <div style=\"max-width:620px;padding:16px 18px;border-radius:12px;background:#FBEFEA;border:2px solid #C4361F\">\n        <div style=\"font-size:15px;font-weight:700;color:#A6371C;margin-bottom:4px\">{{ demandeTitre }}<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.55;color:#A6371C;margin-bottom:12px;text-wrap:pretty\">{{ demandeTexte }}<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ annulerDemande }}\" title=\"Ne rien effacer\" style=\"flex:1;min-width:120px;padding:11px;border-radius:9px;border:1px solid #DDD6C9;background:#FFFFFF;color:#141210;font-size:14px;font-weight:600;cursor:pointer\">Annuler<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ confirmerDemande }}\" title=\"Confirmer l'effacement\" style=\"flex:1;min-width:120px;padding:11px;border-radius:9px;border:none;background:#C4361F;color:#FFFFFF;font-size:14px;font-weight:700;cursor:pointer\">{{ libConfirmer }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"display:flex;align-items:center;gap:20px;padding:22px 26px;margin-top:20px;border-radius:16px 16px 0 0;background:linear-gradient(115deg,#03562A 0%,#0B3D22 45%,#141210 100%)\">\n    <img src=\"bf516514-f6a2-413f-aa59-86f19a167150\" alt=\"FIBDA\" style=\"width:62px;height:62px;object-fit:contain;background:#FCFAF6;border-radius:10px;padding:4px;flex:none\">\n    <div style=\"min-width:0\">\n      <div style=\"font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#EC6D23\">Fédération Ivoirienne de Bodybuilding et Disciplines Associées<\u002Fdiv>\n      <div style=\"font-size:26px;font-weight:700;letter-spacing:-.01em;color:#FCFAF6;line-height:1.15\">Championnat National de Strongman <span style=\"color:#EC6D23\">2026<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-left:auto;display:flex;gap:10px;align-items:center;flex:none\">\n      <sc-if value=\"{{ connecte }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ deconnecter }}\" title=\"Fermer la session et revenir à l'écran de connexion\" style=\"padding:8px 13px;border-radius:9px;border:1px solid rgba(252,250,246,.22);background:transparent;color:#9AA79E;font-size:12px;font-weight:500;cursor:pointer\">{{ libSession }}<\u002Fbutton>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ exporter }}\" title=\"Télécharge le fichier de sauvegarde à conserver hors du poste : clé USB, second ordinateur. À faire avant la compétition et après chaque épreuve.\" style=\"padding:10px 16px;border-radius:9px;border:1px solid rgba(252,250,246,.28);background:rgba(252,250,246,.08);color:#FCFAF6;font-size:13px;font-weight:600;cursor:pointer\">Exporter la sauvegarde<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;height:5px;border-radius:0 0 3px 3px;overflow:hidden\">\n    <div style=\"flex:1;background:#EC6D23\"><\u002Fdiv>\n    <div style=\"flex:1;background:#FFFFFF\"><\u002Fdiv>\n    <div style=\"flex:1;background:#0B9237\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:8px;align-items:center;margin:18px 0 26px;flex-wrap:wrap\">\n    <div style=\"display:flex;gap:4px;padding:4px;border-radius:10px;background:#F0EBE1;border:1px solid #E7E1D6;flex:none\">\n      <button sc-camel-on-click=\"{{ versModeReel }}\" title=\"Compétition réelle : les résultats officiels, les impressions et le procès-verbal\" style=\"padding:7px 13px;border-radius:7px;border:none;background:{{ fondReel }};color:{{ encreReel }};font-size:13px;font-weight:700;cursor:pointer\">Compétition réelle<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ versModeDemo }}\" title=\"Mode démonstration : un espace séparé pour s'entraîner. Ce qui y est saisi ou importé y reste et ne touche jamais la compétition réelle.\" style=\"padding:7px 13px;border-radius:7px;border:none;background:{{ fondDemo }};color:{{ encreDemo }};font-size:13px;font-weight:700;cursor:pointer\">Démonstration<\u002Fbutton>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ versAccueil }}\" title=\"Revenir à l'accueil du championnat\" style=\"padding:7px 13px;border-radius:8px;border:1px solid #E7E1D6;background:#FFFFFF;color:#141210;font-size:13px;font-weight:500;cursor:pointer\">Accueil<\u002Fbutton>\n    <span style=\"color:#B8B0A2;font-size:13px\">›<\u002Fspan>\n    <span style=\"font-size:13px;font-weight:600;color:#03562A\">{{ filAriane }}<\u002Fspan>\n    <span style=\"margin-left:auto;display:flex;gap:7px;align-items:center\" title=\"Chaque modification est écrite sur ce poste dès la saisie ; aucune action n'est nécessaire.\">\n      <span style=\"width:6px;height:6px;border-radius:999px;background:#0B9237;flex:none\"><\u002Fspan>\n      <span style=\"font-size:12px;color:#8A8378\">{{ libAutoEnreg }}<\u002Fspan>\n    <\u002Fspan>\n  <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n  \n\n  <sc-if value=\"{{ besoinLogin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:620px;margin:0 auto;padding:40px 0\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:28px\">\n        <img src=\"bf516514-f6a2-413f-aa59-86f19a167150\" alt=\"FIBDA\" style=\"width:86px;height:86px;object-fit:contain\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#EC6D23;margin-top:12px\">Championnat National de Strongman 2026<\u002Fdiv>\n        <div style=\"font-size:26px;font-weight:700;margin-top:4px\">Qui utilise ce poste ?<\u002Fdiv>\n        <div style=\"font-size:15px;color:#4A443B;line-height:1.5;margin-top:8px;max-width:440px;text-wrap:pretty\">Deux accès seulement : l'administrateur du logiciel et la régie de diffusion. Les juges, arbitres et chronométreurs n'ont pas de code : ils travaillent sur le terrain.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ comptes }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"background:#FFFFFF;border:1px solid {{ c.bord }};border-radius:12px;overflow:hidden\">\n            <button sc-camel-on-click=\"{{ c.choisir }}\" title=\"Ouvrir la session de cette personne\" style=\"display:flex;gap:14px;align-items:center;text-align:left;background:transparent;border:none;padding:15px 18px;cursor:pointer;width:100%\">\n              <span style=\"display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;background:#F5F1E8;color:#03562A;font-size:15px;font-weight:700;flex:none\">{{ c.initiales }}<\u002Fspan>\n              <span style=\"flex:1;min-width:0\">\n                <span style=\"display:block;font-size:16px;font-weight:600\">{{ c.nom }}<\u002Fspan>\n                <span style=\"display:block;font-size:13px;color:#8A8378\">{{ c.role }} · {{ c.portee }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-size:13px;font-weight:600;color:#0B9237;flex:none\">{{ c.libAction }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ c.ouvert }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:0 18px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center\">\n                <input value=\"{{ codeSaisi }}\" sc-camel-on-change=\"{{ setCodeSaisi }}\" sc-camel-on-key-down=\"{{ c.touche }}\" type=\"password\" sc-camel-input-mode=\"numeric\" sc-camel-auto-focus=\"{{ true }}\" placeholder=\"Code d'accès\" style=\"flex:1;min-width:150px;padding:12px 14px;border:1px solid #DDD6C9;border-radius:10px;background:#FCFAF6;font-size:17px;font-weight:700;letter-spacing:.22em;outline:none\">\n                <button sc-camel-on-click=\"{{ c.valider }}\" title=\"Ouvrir la session\" style=\"padding:12px 20px;border-radius:10px;border:none;background:#0B9237;color:#FFFFFF;font-size:15px;font-weight:700;cursor:pointer\">Entrer<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ erreurCode }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:14px;padding:12px 16px;border-radius:10px;background:#FBEFEA;border:1px solid #E9CFC4;color:#A6371C;font-size:14px;font-weight:600;text-align:center\">{{ erreurCode }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"margin-top:20px;font-size:13px;color:#8A8378;line-height:1.5;text-align:center\">Les deux codes se règlent dans Préparation, étape Officiels. Tant qu'aucun code n'est saisi, le logiciel s'ouvre sans connexion.<\u002Fdiv>\n      <div style=\"margin-top:14px;text-align:center\">\n        <button sc-camel-on-click=\"{{ ignorerCodes }}\" title=\"Ouvre le logiciel sans code : à n'utiliser que si vous êtes le responsable du poste et que le code a été perdu\" style=\"padding:11px 18px;border-radius:10px;border:1px dashed #B8B0A2;background:#FFFFFF;color:#6E675C;font-size:13px;font-weight:600;cursor:pointer\">Code perdu — ouvrir sans connexion<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ estAccueil }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:30px\">\n        <div style=\"background:#FFFFFF;border:1px solid #E7E1D6;border-radius:14px;padding:18px 20px\">\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Date et horaires<\u002Fdiv>\n          <input value=\"{{ champDate }}\" sc-camel-on-change=\"{{ setChampDate }}\" title=\"Date officielle, reprise sur les écrans publics et les impressions\" style=\"width:100%;padding:7px 9px;border:1px solid #DDD6C9;border-radius:8px;background:#FCFAF6;font-size:16px;font-weight:600;outline:none\">\n          <div style=\"display:flex;gap:8px;margin-top:8px;align-items:center\">\n            <input value=\"{{ champHeure }}\" sc-camel-on-change=\"{{ setChampHeure }}\" title=\"Heure d'ouverture\" style=\"flex:1;min-width:0;padding:7px 9px;border:1px solid #DDD6C9;border-radius:8px;background:#FCFAF6;font-size:14px;font-weight:600;color:#03562A;outline:none\">\n            <span style=\"font-size:13px;color:#8A8378;flex:none\">→<\u002Fspan>\n            <input value=\"{{ champFin }}\" sc-camel-on-change=\"{{ setChampFin }}\" title=\"Heure de clôture prévue\" style=\"flex:1;min-width:0;padding:7px 9px;border:1px solid #DDD6C9;border-radius:8px;background:#FCFAF6;font-size:14px;font-weight:600;color:#03562A;outline:none\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;border:1px solid #E7E1D6;border-radius:14px;padding:18px 20px\">\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Lieu<\u002Fdiv>\n          <input value=\"{{ champLieu }}\" sc-camel-on-change=\"{{ setChampLieu }}\" title=\"Site de la compétition\" style=\"width:100%;padding:7px 9px;border:1px solid #DDD6C9;border-radius:8px;background:#FCFAF6;font-size:16px;font-weight:600;outline:none\">\n          <input value=\"{{ champAdresse }}\" sc-camel-on-change=\"{{ setChampAdresse }}\" title=\"Adresse complète\" style=\"width:100%;margin-top:8px;padding:7px 9px;border:1px solid #DDD6C9;border-radius:8px;background:#FCFAF6;font-size:13px;color:#6E675C;outline:none\">\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;border:1px solid #E7E1D6;border-radius:14px;padding:18px 20px\">\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Engagés<\u002Fdiv>\n          <div style=\"font-size:19px;font-weight:600\">{{ nbAthletes }} athlètes · {{ nbEpreuves }} épreuves<\u002Fdiv>\n          <div style=\"font-size:14px;color:#6E675C;margin-top:2px\">{{ nbPeses }} pesées validées<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px\">\n        <div style=\"background:#FFFFFF;border:1px solid #E7E1D6;border-radius:16px;padding:26px;display:flex;flex-direction:column\">\n          <div style=\"display:inline-flex;align-self:flex-start;padding:5px 11px;border-radius:999px;background:rgba(236,109,35,.12);color:#BC4F14;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px\">Étape par étape<\u002Fdiv>\n          <div style=\"font-size:24px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px\">Préparer la compétition<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.55;color:#4A443B;margin-bottom:20px;text-wrap:pretty\">Épreuves, groupes de poids, officiels, athlètes, pesée et programme. Enregistrez à tout moment, revenez plus tard : un récapitulatif indique ce qui manque.<\u002Fdiv>\n          <div style=\"margin-top:auto;display:flex;gap:10px;flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ versPreparation }}\" title=\"Ouvre le parcours guidé en 6 étapes : épreuves, groupes, officiels, athlètes, pesée, programme\" style=\"padding:13px 22px;border-radius:11px;border:none;background:#0B9237;color:#FFFFFF;font-size:15px;font-weight:600;cursor:pointer\">{{ libPreparer }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ versRecap }}\" title=\"Liste ce qui est prêt et ce qui manque avant le jour J\" style=\"padding:13px 20px;border-radius:11px;border:1px solid #DDD6C9;background:#FCFAF6;color:#141210;font-size:15px;font-weight:500;cursor:pointer\">Récapitulatif<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#FFFFFF;border:1px solid #E7E1D6;border-radius:16px;padding:26px;display:flex;flex-direction:column\">\n          <div style=\"display:inline-flex;align-self:flex-start;padding:5px 11px;border-radius:999px;background:rgba(11,146,55,.12);color:#03562A;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px\">Jour J<\u002Fdiv>\n          <div style=\"font-size:24px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px\">Lancer / reprendre<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.55;color:#4A443B;margin-bottom:20px;text-wrap:pretty\">Plateau, athlète au plateau, chronomètre deux appuis, saisie des performances par la table, régie et mur LED, impressions et procès-verbal.<\u002Fdiv>\n          <div style=\"margin-top:auto;display:flex;gap:10px;flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ versPlateau }}\" title=\"Ouvre le plateau : ordre de passage, chronomètre, saisie et validation des performances\" style=\"padding:13px 22px;border-radius:11px;border:none;background:#141210;color:#FFFFFF;font-size:15px;font-weight:600;cursor:pointer\">Ouvrir le plateau<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#141210;border:1px solid #141210;border-radius:16px;padding:26px;display:flex;flex-direction:column;color:#FCFAF6\">\n          <div style=\"display:inline-flex;align-self:flex-start;padding:5px 11px;border-radius:999px;background:rgba(236,109,35,.22);color:#F7A76C;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px\">Écrans géants<\u002Fdiv>\n          <div style=\"font-size:24px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px\">Régie de diffusion<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.55;color:#C9C2B6;margin-bottom:20px;text-wrap:pretty\">Déclarez vos sorties vidéo, choisissez ce que chaque mur LED affiche, réglez la lisibilité avec la mire, puis ouvrez les fenêtres à glisser sur les écrans.<\u002Fdiv>\n          <div style=\"margin-top:auto;display:flex;gap:10px;flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ versRegie }}\" title=\"Paramétrer la régie : sorties, contenus, jour/nuit\" style=\"padding:13px 22px;border-radius:11px;border:none;background:#EC6D23;color:#FFFFFF;font-size:15px;font-weight:600;cursor:pointer\">Paramétrer la régie<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ ouvrirMire }}\" title=\"Ouvre la mire de lisibilité pour régler le mur LED\" style=\"padding:13px 20px;border-radius:11px;border:1px solid rgba(252,250,246,.28);background:transparent;color:#FCFAF6;font-size:15px;font-weight:500;cursor:pointer\">Mire de réglage<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ erreurEnreg }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:20px;padding:14px 18px;border-radius:12px;background:#FBEFEA;border:1px solid #E9CFC4;color:#A6371C;font-size:14px;line-height:1.5;font-weight:600\">{{ erreurEnreg }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"margin-top:28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center\">\n        <button sc-camel-on-click=\"{{ exporterListe }}\" title=\"Liste des athlètes en CSV, à ouvrir dans Excel\" style=\"padding:10px 16px;border-radius:9px;border:1px solid #DDD6C9;background:#FFFFFF;color:#141210;font-size:13px;font-weight:500;cursor:pointer\">Exporter les athlètes (Excel)<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ exporterExcel }}\" title=\"Classeur Excel complet : athlètes, catégories, épreuves, résultats et classements, une feuille par rubrique\" style=\"padding:10px 16px;border-radius:9px;border:none;background:#03562A;color:#FFFFFF;font-size:13px;font-weight:600;cursor:pointer\">Exporter la compétition (Excel)<\u002Fbutton>\n        <label title=\"Recharge une compétition depuis un classeur Excel exporté par ce logiciel, ou depuis une sauvegarde .json\" style=\"padding:10px 16px;border-radius:9px;border:1px solid #DDD6C9;background:#FFFFFF;color:#141210;font-size:13px;font-weight:500;cursor:pointer\">Importer une compétition\n          <input type=\"file\" accept=\".xls,.xml,.json\" sc-camel-on-change=\"{{ importerExcel }}\" style=\"display:none\">\n        <\u002Flabel>\n        <button sc-camel-on-click=\"{{ exporterClassements }}\" title=\"Classements par groupe et par épreuve en CSV\" style=\"padding:10px 16px;border-radius:9px;border:1px solid #DDD6C9;background:#FFFFFF;color:#141210;font-size:13px;font-weight:500;cursor:pointer\">Exporter les classements (Excel)<\u002Fbutton>\n        <sc-if value=\"{{ modeReel }}\" hint-placeholder-val=\"{{ true }}\">\n          <button sc-camel-on-click=\"{{ copierVersDemo }}\" title=\"Recopie les athlètes, photos et réglages actuels dans l'espace de démonstration, puis y bascule. La compétition réelle n'est pas modifiée.\" style=\"padding:10px 16px;border-radius:9px;border:1px solid #DDD6C9;background:#FFFFFF;color:#141210;font-size:13px;font-weight:500;cursor:pointer\">Copier cette liste dans la démonstration<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ modeReel }}\" hint-placeholder-val=\"{{ true }}\">\n          <button sc-camel-on-click=\"{{ demanderVierge }}\" title=\"Repart à vide pour la compétition officielle : athlètes, passages et résultats effacés\" style=\"padding:10px 16px;border-radius:9px;border:1px solid #E9CFC4;background:#FFFFFF;color:#A6371C;font-size:13px;font-weight:500;cursor:pointer\">Démarrer une compétition réelle vierge<\u002Fbutton>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ demanderViderListe }}\" title=\"Supprime tous les athlètes de cette liste, ainsi que les passages et résultats\" style=\"padding:10px 16px;border-radius:9px;border:1px solid #E9CFC4;background:#FFFFFF;color:#A6371C;font-size:13px;font-weight:500;cursor:pointer\">Supprimer la liste des athlètes<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ demanderTout }}\" title=\"Efface toute la saisie et rétablit les 5 épreuves et 2 groupes officiels\" style=\"padding:10px 16px;border-radius:9px;border:1px solid #E9CFC4;background:#FFFFFF;color:#A6371C;font-size:13px;font-weight:500;cursor:pointer\">Tout remettre à zéro<\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ msgImportComp }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:14px;max-width:620px;padding:13px 16px;border-radius:11px;background:rgba(11,146,55,.07);border:1px solid rgba(11,146,55,.2);color:#03562A;font-size:13px;line-height:1.5;font-weight:600\">{{ msgImportComp }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ estPrepa }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div style=\"display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;margin-bottom:22px;border-bottom:1px solid #E7E1D6\">\n        <sc-for list=\"{{ etapes }}\" as=\"et\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ et.aller }}\" title=\"Étape {{ et.num }} — {{ et.titre }}\" style=\"display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:10px;border:1px solid {{ et.bord }};background:{{ et.fond }};color:{{ et.encre }};font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none\">\n            <span style=\"display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:999px;background:{{ et.puceFond }};color:{{ et.puceEncre }};font-size:11px;font-weight:700\">{{ et.num }}<\u002Fspan>\n            {{ et.titre }}\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ etape0 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.01em;margin-bottom:6px\">Épreuves <span style=\"color:#EC6D23\">du championnat<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;color:#4A443B;line-height:1.55;max-width:760px;margin-bottom:22px;text-wrap:pretty\">Les cinq épreuves officielles sont pré-remplies avec le critère de classement du règlement. Ajoutez autant d'épreuves que nécessaire, chacune avec sa mesure, son temps imparti et son nombre d'essais.<\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <sc-for list=\"{{ epreuves }}\" as=\"ep\" hint-placeholder-count=\"5\">\n              <div style=\"background:#FFFFFF;border:1px solid #E7E1D6;border-radius:14px;overflow:hidden\">\n                <div style=\"height:4px;background:{{ ep.bande }}\"><\u002Fdiv>\n                <div style=\"padding:18px 20px\">\n                  <div style=\"display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap\">\n                    <div style=\"display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:#141210;color:#FCFAF6;font-size:14px;font-weight:700;flex:none\">{{ ep.num }}<\u002Fdiv>\n                    <div style=\"flex:1;min-width:220px\">\n                      <input value=\"{{ ep.nom }}\" sc-camel-on-change=\"{{ ep.setNom }}\" title=\"Nom annoncé par le speaker et affiché sur le mur LED\" placeholder=\"Nom de l'épreuve\" style=\"width:100%;padding:9px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;color:#141210;font-size:16px;font-weight:600;outline:none\">\n                    <\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ ep.suppr }}\" title=\"Retire cette épreuve du championnat\" style=\"padding:8px 13px;border-radius:8px;border:1px solid #E9CFC4;background:#FFFFFF;color:#A6371C;font-size:13px;font-weight:500;cursor:pointer;flex:none\">Retirer<\u002Fbutton>\n                  <\u002Fdiv>\n\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:16px\">\n                    <div>\n                      <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Mesure<\u002Fdiv>\n                      <sc-raw-select value=\"{{ ep.mesure }}\" sc-camel-on-change=\"{{ ep.setMesure }}\" title=\"Ce qui est mesuré : cela détermine la saisie du juge et le sens du classement\" style=\"width:100%;padding:10px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;color:#141210;font-size:14px;outline:none\">\n                        <option value=\"nb_temps\">Nombre, puis temps<\u002Foption>\n                        <option value=\"poids\">Charge maximale (kg)<\u002Foption>\n                        <option value=\"duree\">Temps de maintien<\u002Foption>\n                        <option value=\"chrono\">Temps sur distance<\u002Foption>\n                        <option value=\"distance\">Distance parcourue<\u002Foption>\n                        <option value=\"medley\">Medley — parcours à ateliers<\u002Foption>\n                      <\u002Fsc-raw-select>\n                      <div style=\"font-size:12px;color:#8A8378;margin-top:5px;line-height:1.4\">{{ ep.aide }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div>\n                      <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Temps imparti<\u002Fdiv>\n                      <input value=\"{{ ep.temps }}\" sc-camel-on-change=\"{{ ep.setTemps }}\" title=\"Durée préparée d'office sur le chronomètre à chaque passage de cette épreuve\" placeholder=\"ex. 60 s ou illimité\" style=\"width:100%;padding:10px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;color:#141210;font-size:14px;outline:none\">\n                    <\u002Fdiv>\n                    <div>\n                      <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Essais par athlète<\u002Fdiv>\n                      <input value=\"{{ ep.essais }}\" sc-camel-on-change=\"{{ ep.setEssais }}\" title=\"Nombre de tentatives autorisées ; le meilleur essai est retenu\" type=\"number\" min=\"1\" max=\"9\" style=\"width:100%;padding:10px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;color:#141210;font-size:14px;outline:none\">\n                    <\u002Fdiv>\n                    <div>\n                      <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Passage<\u002Fdiv>\n                      <sc-raw-select value=\"{{ ep.passage }}\" sc-camel-on-change=\"{{ ep.setPassage }}\" title=\"Par groupe : les −100 kg passent, puis les +100 kg. Mélangé : tout le monde dans un seul ordre. Les classements restent séparés dans les deux cas.\" style=\"width:100%;padding:10px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;color:#141210;font-size:14px;outline:none\">\n                        <option value=\"groupe\">Par groupe de poids<\u002Foption>\n                        <option value=\"melange\">Tout le monde mélangé<\u002Foption>\n                      <\u002Fsc-raw-select>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px;padding:12px 14px;border-radius:11px;background:#F5F1E8\">\n                    <button sc-camel-on-click=\"{{ ep.basculerNiveau }}\" title=\"Épreuve à niveaux : chaque athlète déclare son niveau (hauteur de prise, cran, palier). Le niveau s'affiche sur sa fiche, à la sélection de l'épreuve et sur le mur LED pendant son passage.\" style=\"padding:9px 14px;border-radius:9px;border:1px solid {{ ep.bordNiveau }};background:{{ ep.fondNiveau }};color:{{ ep.encreNiveau }};font-size:13px;font-weight:700;cursor:pointer;flex:none\">{{ ep.libNiveau }}<\u002Fbutton>\n                    <div style=\"flex:1;min-width:180px;font-size:12px;color:#6E675C;line-height:1.45;text-wrap:pretty\">{{ ep.aideNiveau }}<\u002Fdiv>\n                    <sc-if value=\"{{ ep.niveau }}\" hint-placeholder-val=\"{{ false }}\">\n                      <input value=\"{{ ep.niveauxOptions }}\" sc-camel-on-change=\"{{ ep.setNiveauxOptions }}\" placeholder=\"Niveau 1, Niveau 2, Niveau 3\" title=\"Niveaux proposés, séparés par des virgules. Chaque athlète choisit le sien.\" style=\"flex:1 1 220px;min-width:180px;padding:9px 11px;border:1px solid #DDD6C9;border-radius:8px;background:#FFFFFF;font-size:14px;outline:none\">\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n\n                  <sc-if value=\"{{ ep.estMedley }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:14px;padding:14px;border-radius:11px;background:#FFF6E8;border:1px solid #F0D8B0\">\n                      <div style=\"font-size:14px;font-weight:700;color:#8A5A0B;margin-bottom:4px\">Medley — parcours à ateliers<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#8A5A0B;line-height:1.5;margin-bottom:12px;text-wrap:pretty\">Un medley enchaîne plusieurs agrès sur une même distance, chronométré du départ à la ligne d'arrivée. Décrivez ici les ateliers dans l'ordre, la distance de chaque portage et la règle de fin de temps.<\u002Fdiv>\n                      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px\">\n                        <div>\n                          <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Ateliers dans l'ordre<\u002Fdiv>\n                          <textarea value=\"{{ ep.ateliers }}\" sc-camel-on-change=\"{{ ep.setAteliers }}\" title=\"Un atelier par ligne : agrès, charge et distance\" rows=\"4\" placeholder=\"Yoke 350 kg — 15 m\nFarmer's walk 2×120 kg — 15 m\nSandbag 100 kg — 15 m\" style=\"width:100%;padding:9px 11px;border:1px solid #DDD6C9;border-radius:8px;background:#FFFFFF;font-size:14px;line-height:1.5;outline:none;resize:vertical\"><\u002Ftextarea>\n                        <\u002Fdiv>\n                        <div>\n                          <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Distance totale<\u002Fdiv>\n                          <input value=\"{{ ep.distanceTotale }}\" sc-camel-on-change=\"{{ ep.setDistanceTotale }}\" placeholder=\"45 m\" title=\"Distance cumulée du parcours\" style=\"width:100%;padding:9px 11px;border:1px solid #DDD6C9;border-radius:8px;background:#FFFFFF;font-size:14px;outline:none\">\n                          <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin:12px 0 6px\">Fin de temps<\u002Fdiv>\n                          <input value=\"{{ ep.regleFin }}\" sc-camel-on-change=\"{{ ep.setRegleFin }}\" placeholder=\"Distance atteinte au coup de sifflet\" title=\"Ce qui est retenu si l'athlète n'achève pas le parcours\" style=\"width:100%;padding:9px 11px;border:1px solid #DDD6C9;border-radius:8px;background:#FFFFFF;font-size:14px;outline:none\">\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n\n                  <div style=\"margin-top:16px;border-left:3px solid #EC6D23;padding:10px 0 10px 14px;background:rgba(236,109,35,.05)\">\n                    <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Critère de classement<\u002Fdiv>\n                    <textarea value=\"{{ ep.critere }}\" sc-camel-on-change=\"{{ ep.setCritere }}\" title=\"Texte du règlement, rappelé au juge et au speaker avant chaque passage\" rows=\"2\" style=\"width:100%;padding:9px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FFFFFF;color:#141210;font-size:14px;line-height:1.5;outline:none;resize:vertical\"><\u002Ftextarea>\n                  <\u002Fdiv>\n\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px\">\n                    <div>\n                      <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Matériel de compétition<\u002Fdiv>\n                      <input value=\"{{ ep.materiel }}\" sc-camel-on-change=\"{{ ep.setMateriel }}\" title=\"Matériel fourni par l'organisation, sert à la check-list de plateau\" style=\"width:100%;padding:10px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;color:#141210;font-size:14px;outline:none\">\n                    <\u002Fdiv>\n                    <div>\n                      <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Équipements personnels autorisés<\u002Fdiv>\n                      <input value=\"{{ ep.equipements }}\" sc-camel-on-change=\"{{ ep.setEquipements }}\" title=\"Équipements personnels autorisés, contrôlés à la vérification d'avant-pesée\" style=\"width:100%;padding:10px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;color:#141210;font-size:14px;outline:none\">\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:16px\">\n            <button sc-camel-on-click=\"{{ ajouterEpreuve }}\" title=\"Crée une épreuve supplémentaire avec ses propres critères de notation\" style=\"padding:12px 20px;border-radius:10px;border:1px dashed #B8B0A2;background:#FFFFFF;color:#03562A;font-size:14px;font-weight:600;cursor:pointer\">+ Ajouter une épreuve<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ ajouterMedley }}\" title=\"Crée un medley : parcours à ateliers enchaînés sur une même distance, chronométré du départ à l'arrivée. Ateliers, distance et règle de fin de temps entièrement paramétrables.\" style=\"padding:12px 20px;border-radius:10px;border:1px solid #EC6D23;background:#FFF6E8;color:#BC4F14;font-size:14px;font-weight:700;cursor:pointer\">+ Ajouter un medley<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:22px;padding:14px 16px;border-radius:11px;background:rgba(11,146,55,.07);border:1px solid rgba(11,146,55,.18);font-size:13px;line-height:1.5;color:#03562A\">Barème appliqué : <strong>Points = N − Rang + 1<\u002Fstrong>, N étant le nombre de participants classés du groupe. Ex æquo : mêmes points, rang suivant sauté. Un zéro ou un forfait vaut 0 point et l'athlète reste classé au général.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ etape1 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"font-size:22px;font-weight:700;text-transform:uppercase;margin-bottom:6px\">Groupes <span style=\"color:#EC6D23\">de poids<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;color:#4A443B;line-height:1.55;max-width:760px;margin-bottom:22px;text-wrap:pretty\">Championnat réservé aux hommes. Deux groupes : moins de 100 kg et plus de 100 kg. Chaque groupe a son propre classement, même quand le passage se fait tout le monde mélangé. Seules les catégories retenues sont proposées au plateau et affichées sur les écrans géants.<\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px\">\n            <sc-for list=\"{{ groupes }}\" as=\"g\" hint-placeholder-count=\"2\">\n              <div style=\"background:#FFFFFF;border:1px solid #E7E1D6;border-radius:14px;overflow:hidden\">\n                <div style=\"height:4px;background:{{ g.bande }}\"><\u002Fdiv>\n                <div style=\"padding:18px 20px\">\n                  <input value=\"{{ g.nom }}\" sc-camel-on-change=\"{{ g.setNom }}\" title=\"Nom du groupe tel qu'il apparaît sur les classements et les impressions\" style=\"width:100%;padding:9px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;font-size:17px;font-weight:600;outline:none\">\n                  <div style=\"display:flex;gap:12px;margin-top:14px\">\n                    <div style=\"flex:1\">\n                      <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Poids min (kg)<\u002Fdiv>\n                      <input value=\"{{ g.min }}\" sc-camel-on-change=\"{{ g.setMin }}\" title=\"Poids au-dessus duquel un athlète entre dans ce groupe. Laisser vide s'il n'y a pas de limite basse.\" placeholder=\"—\" style=\"width:100%;padding:10px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;font-size:14px;outline:none\">\n                    <\u002Fdiv>\n                    <div style=\"flex:1\">\n                      <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Poids max (kg)<\u002Fdiv>\n                      <input value=\"{{ g.max }}\" sc-camel-on-change=\"{{ g.setMax }}\" title=\"Poids maximum inclus dans ce groupe. Laisser vide s'il n'y a pas de limite haute.\" placeholder=\"—\" style=\"width:100%;padding:10px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;font-size:14px;outline:none\">\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:8px;margin-top:14px\">\n                    <button sc-camel-on-click=\"{{ g.retenir }}\" title=\"Retenir cette catégorie : elle est proposée au plateau et affichée sur les écrans géants\" style=\"flex:1;padding:11px;border-radius:9px;border:1px solid {{ g.bordRetenue }};background:{{ g.fondRetenue }};color:{{ g.encreRetenue }};font-size:14px;font-weight:700;cursor:pointer\">Sélectionner<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ g.mettreDeCote }}\" title=\"Mettre cette catégorie de côté : elle reste enregistrée mais disparaît du plateau et des écrans\" style=\"flex:1;padding:11px;border-radius:9px;border:1px solid {{ g.bordCote }};background:{{ g.fondCote }};color:{{ g.encreCote }};font-size:14px;font-weight:700;cursor:pointer\">Mettre de côté<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:8px;font-size:12px;line-height:1.45;color:#8A8378;text-wrap:pretty\">{{ g.etatCategorie }}<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid #F0EBE1\">\n                    <div style=\"font-size:14px;color:#4A443B\">{{ g.effectif }}<\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ g.demanderSuppr }}\" title=\"Retirer cette catégorie\" style=\"padding:7px 12px;border-radius:8px;border:1px solid #E9CFC4;background:#FFFFFF;color:#A6371C;font-size:13px;cursor:pointer;flex:none\">Retirer<\u002Fbutton>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ g.aSupprimer }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:12px;padding:14px;border-radius:11px;background:#FBEFEA;border:1px solid #E9CFC4\">\n                      <div style=\"font-size:14px;font-weight:700;color:#A6371C;margin-bottom:4px\">Supprimer « {{ g.nom }} » ?<\u002Fdiv>\n                      <div style=\"font-size:13px;line-height:1.5;color:#A6371C;margin-bottom:12px;text-wrap:pretty\">{{ g.avertSuppr }}<\u002Fdiv>\n                      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                        <button sc-camel-on-click=\"{{ g.annulerSuppr }}\" title=\"Ne rien supprimer\" style=\"flex:1;min-width:110px;padding:10px;border-radius:9px;border:1px solid #DDD6C9;background:#FFFFFF;color:#141210;font-size:14px;font-weight:600;cursor:pointer\">Annuler<\u002Fbutton>\n                        <button sc-camel-on-click=\"{{ g.suppr }}\" title=\"Supprimer définitivement cette catégorie\" style=\"flex:1;min-width:110px;padding:10px;border-radius:9px;border:none;background:#C4361F;color:#FFFFFF;font-size:14px;font-weight:700;cursor:pointer\">Supprimer<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ ajouterGroupe }}\" title=\"Ajoute un groupe de poids supplémentaire\" style=\"margin-top:16px;padding:12px 20px;border-radius:10px;border:1px dashed #B8B0A2;background:#FFFFFF;color:#03562A;font-size:14px;font-weight:600;cursor:pointer\">+ Ajouter un groupe<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ etape2 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"font-size:22px;font-weight:700;text-transform:uppercase;margin-bottom:6px\">Officiels <span style=\"color:#EC6D23\">et corps arbitral<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;color:#4A443B;line-height:1.55;max-width:760px;margin-bottom:22px;text-wrap:pretty\">Minimum réglementaire : cinq arbitres principaux, deux responsables techniques, des chronométreurs et un secrétaire de table. Les juges valident l'essai sur le terrain et n'ont rien à saisir : la table enregistre la performance. Leurs noms servent à la feuille de notation et au procès-verbal.<\u002Fdiv>\n\n          <div style=\"background:#FFFFFF;border:2px solid #141210;border-radius:14px;padding:18px 20px;margin-bottom:18px\">\n            <div style=\"font-size:16px;font-weight:700;margin-bottom:4px\">Codes d'accès du logiciel<\u002Fdiv>\n            <div style=\"font-size:14px;color:#6E675C;line-height:1.5;margin-bottom:14px;text-wrap:pretty\">Deux codes seulement. Laissez-les vides pour que le logiciel s'ouvre sans connexion.<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px\">\n              <div>\n                <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Administrateur<\u002Fdiv>\n                <input value=\"{{ accesAdmin }}\" sc-camel-on-change=\"{{ setAccesAdmin }}\" placeholder=\"0000\" title=\"Code du poste maître : préparation, plateau, saisie des performances, impressions\" style=\"width:100%;padding:11px 13px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;font-size:17px;font-weight:700;letter-spacing:.2em;outline:none\">\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:6px\">Régie<\u002Fdiv>\n                <input value=\"{{ accesRegie }}\" sc-camel-on-change=\"{{ setAccesRegie }}\" placeholder=\"0000\" title=\"Code du poste de diffusion : écrans géants uniquement\" style=\"width:100%;padding:11px 13px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;font-size:17px;font-weight:700;letter-spacing:.2em;outline:none\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#FFFFFF;border:1px solid #E7E1D6;border-radius:14px;overflow:hidden\">\n            <sc-for list=\"{{ officiels }}\" as=\"o\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:12px;padding:12px 18px;border-top:1px solid #F0EBE1;align-items:center\">\n                <input value=\"{{ o.nom }}\" sc-camel-on-change=\"{{ o.setNom }}\" title=\"Nom porté sur la feuille de notation et le procès-verbal\" placeholder=\"Nom, prénoms\" style=\"flex:2 1 220px;min-width:170px;padding:9px 11px;border:1px solid #DDD6C9;border-radius:8px;background:#FCFAF6;font-size:14px;outline:none\">\n                <sc-raw-select value=\"{{ o.role }}\" sc-camel-on-change=\"{{ o.setRole }}\" title=\"Le rôle décide de ce que la personne voit et peut valider\" style=\"flex:2 1 200px;min-width:160px;padding:9px 11px;border:1px solid #DDD6C9;border-radius:8px;background:#FCFAF6;font-size:14px;outline:none\">\n                  <option value=\"directeur\">Directeur de compétition<\u002Foption>\n                  <option value=\"technique\">Responsable technique<\u002Foption>\n                  <option value=\"arbitrage\">Responsable arbitrage<\u002Foption>\n                  <option value=\"juge\">Juge principal<\u002Foption>\n                  <option value=\"chrono\">Chronométreur<\u002Foption>\n                  <option value=\"secretaire\">Secrétaire de table<\u002Foption>\n                  <option value=\"regie\">Régie<\u002Foption>\n                  <option value=\"speaker\">Speaker<\u002Foption>\n                <\u002Fsc-raw-select>\n                <button sc-camel-on-click=\"{{ o.suppr }}\" title=\"Retire cet officiel\" style=\"flex:0 0 auto;padding:9px 14px;border-radius:8px;border:1px solid #E9CFC4;background:#FFFFFF;color:#A6371C;font-size:13px;cursor:pointer\">Retirer<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ ajouterOfficiel }}\" title=\"Ajoute un officiel : juge, chronométreur, secrétaire, régie, speaker\" style=\"margin-top:16px;padding:12px 20px;border-radius:10px;border:1px dashed #B8B0A2;background:#FFFFFF;color:#03562A;font-size:14px;font-weight:600;cursor:pointer\">+ Ajouter un officiel<\u002Fbutton>\n          <div style=\"margin-top:18px;font-size:13px;color:#8A8378;line-height:1.5\">{{ manqueOfficiels }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ etape3 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"font-size:22px;font-weight:700;text-transform:uppercase;margin-bottom:6px\">Athlètes <span style=\"color:#EC6D23\">engagés<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;color:#4A443B;line-height:1.55;max-width:760px;margin-bottom:18px;text-wrap:pretty\">Importez votre liste, ou saisissez les fiches une par une. Les athlètes non ivoiriens sont marqués Invité et restent hors classement officiel. Les numéros de dossard se saisissent à la main, ici ou à la pesée : ils fixent l'ordre de passage de la première épreuve, du plus petit au plus grand. Les épreuves suivantes se rangent ensuite du total de points le plus bas au plus haut.<\u002Fdiv>\n\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px\">\n            <button sc-camel-on-click=\"{{ ouvrirImport }}\" title=\"Lire une liste depuis un fichier Excel, CSV, Word ou PDF, ou coller un texte\" style=\"padding:11px 18px;border-radius:10px;border:none;background:#0B9237;color:#FFFFFF;font-size:14px;font-weight:600;cursor:pointer\">Importer une liste<\u002Fbutton>\n            <label title=\"Déposez toutes les photos en une fois : la correspondance se fait sur le nom du fichier\" style=\"padding:11px 18px;border-radius:10px;border:1px solid #DDD6C9;background:#FFFFFF;color:#141210;font-size:14px;font-weight:600;cursor:pointer\">Photos groupées\n              <input type=\"file\" accept=\"image/*\" multiple=\"{{ true }}\" sc-camel-on-change=\"{{ photosGroupees }}\" style=\"display:none\">\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ ajouterAthlete }}\" title=\"Ajoute une fiche athlète vierge\" style=\"padding:11px 18px;border-radius:10px;border:1px solid #DDD6C9;background:#FFFFFF;color:#141210;font-size:14px;font-weight:600;cursor:pointer\">+ Athlète<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ viderDossards }}\" title=\"Efface tous les numéros de dossard pour les saisir à la main. L'ordre de passage de la première épreuve suit les dossards croissants.\" style=\"padding:11px 18px;border-radius:10px;border:1px solid #141210;background:#FFFFFF;color:#141210;font-size:14px;font-weight:600;cursor:pointer\">Effacer les dossards<\u002Fbutton>\n            <input value=\"{{ recherche }}\" sc-camel-on-change=\"{{ setRecherche }}\" placeholder=\"Rechercher un nom, un club\" title=\"Filtre la liste au fur et à mesure de la saisie\" style=\"flex:1;min-width:180px;padding:11px 13px;border:1px solid #DDD6C9;border-radius:10px;background:#FCFAF6;font-size:14px;outline:none\">\n            <sc-raw-select value=\"{{ filtre }}\" sc-camel-on-change=\"{{ setFiltre }}\" title=\"Filtrer la liste\" style=\"padding:11px 13px;border:1px solid #DDD6C9;border-radius:10px;background:#FCFAF6;font-size:14px;outline:none\">\n              <sc-for list=\"{{ filtres }}\" as=\"ft\" hint-placeholder-count=\"2\">\n                <option value=\"{{ ft.cle }}\">{{ ft.lbl }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div style=\"font-size:13px;color:#8A8378;margin-bottom:14px\">{{ nbAffiches }}<\u002Fdiv>\n\n          <sc-if value=\"{{ impOuvert }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#FFFFFF;border:2px solid #141210;border-radius:14px;padding:20px;margin-bottom:18px\">\n              <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px\">\n                <div style=\"font-size:18px;font-weight:700\">Importer une liste d'athlètes<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ fermerImport }}\" title=\"Fermer sans rien importer\" style=\"margin-left:auto;padding:8px 13px;border-radius:9px;border:1px solid #DDD6C9;background:#FCFAF6;color:#6E675C;font-size:13px;cursor:pointer\">Fermer<\u002Fbutton>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ impSource }}\" hint-placeholder-val=\"{{ true }}\">\n                <div>\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px\">\n                    <div style=\"border:1px dashed #B8B0A2;border-radius:12px;padding:18px;text-align:center\">\n                      <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:8px\">Depuis un fichier<\u002Fdiv>\n                      <label title=\"Excel, CSV, Word ou PDF\" style=\"display:inline-block;padding:11px 18px;border-radius:10px;border:none;background:#141210;color:#FFFFFF;font-size:14px;font-weight:600;cursor:pointer\">Choisir un fichier\n                        <input type=\"file\" accept=\".xlsx,.csv,.txt,.docx,.pdf\" sc-camel-on-change=\"{{ importerFichier }}\" style=\"display:none\">\n                      <\u002Flabel>\n                      <div style=\"font-size:12px;color:#8A8378;margin-top:10px;line-height:1.45\">Excel et CSV sont les plus fiables. Word ne marche bien qu'avec un vrai tableau. Le PDF est lu au mieux et les lignes douteuses sont signalées.<\u002Fdiv>\n                      <button sc-camel-on-click=\"{{ modeleCSV }}\" title=\"Télécharge un fichier vierge avec les bonnes colonnes\" style=\"margin-top:12px;padding:8px 13px;border-radius:9px;border:1px solid #DDD6C9;background:#FCFAF6;color:#141210;font-size:13px;cursor:pointer\">Télécharger le modèle<\u002Fbutton>\n                    <\u002Fdiv>\n                    <div style=\"border:1px dashed #B8B0A2;border-radius:12px;padding:18px\">\n                      <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378;margin-bottom:8px\">Ou coller la liste<\u002Fdiv>\n                      <textarea value=\"{{ impTexte }}\" sc-camel-on-change=\"{{ setImpTexte }}\" rows=\"6\" placeholder=\"Collez ici la liste copiée depuis Word, un PDF ou un tableau\" style=\"width:100%;padding:10px 12px;border:1px solid #DDD6C9;border-radius:9px;background:#FCFAF6;font-size:14px;line-height:1.5;outline:none;resize:vertical\"><\u002Ftextarea>\n                      <button sc-camel-on-click=\"{{ importerTexte }}\" title=\"Analyse le texte collé\" style=\"margin-top:10px;padding:10px 16px;border-radius:9px;border:none;background:#0B9237;color:#FFFFFF;font-size:14px;font-weight:600;cursor:pointer\">Lire ce texte<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:13px;color:#A6371C;margin-top:12px;line-height:1.45\">{{ impErreur }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ impLecture }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:26px 0;text-align:center;font-size:15px;color:#6E675C\">Lecture du fichier en cours…<\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ impVerif }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>\n                  <div style=\"font-size:13px;color:#6E675C;margin-bottom:12px\">Source : {{ impNomSource }}. Vérifiez, décochez ce qui ne doit pas entrer, puis importez. Les lignes en rose ont un doute.<\u002Fdiv>\n                  <div style=\"border:1px solid #E7E1D6;border-radius:12px;overflow:hidden\">\n                    <div style=\"display:grid;grid-template-columns:44px 1.5fr 1fr 80px 1fr;gap:10px;padding:10px 14px;background:#F5F1E8;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#6E675C\">\n                      <div>Garder<\u002Fdiv>\n                      <div>Nom et prénoms<\u002Fdiv>\n                      <div>Club<\u002Fdiv>\n                      <div>Poids<\u002Fdiv>\n                      <div>Téléphones<\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ impLignes }}\" as=\"l\" hint-placeholder-count=\"6\">\n                      <div style=\"display:grid;grid-template-columns:44px 1.5fr 1fr 80px 1fr;gap:10px;padding:10px 14px;border-top:1px solid #F0EBE1;align-items:center;background:{{ l.fondLigne }}\">\n                        <button sc-camel-on-click=\"{{ l.basculerGarder }}\" title=\"Cocher ou décocher cette ligne\" style=\"width:26px;height:26px;border-radius:7px;border:1.5px solid #B8B0A2;background:#FFFFFF;color:#0B9237;font-size:14px;font-weight:700;cursor:pointer\">{{ l.marque }}<\u002Fbutton>\n                        <div style=\"min-width:0\">\n                          <div style=\"font-size:14px;font-weight:600\">{{ l.nom }} <span style=\"font-weight:400\">{{ l.prenoms }}<\u002Fspan><\u002Fdiv>\n                          <div style=\"font-size:12px;color:#BC4F14\">{{ l.motifs }}<\u002Fdiv>\n                          <sc-if value=\"{{ l.doublon }}\" hint-placeholder-val=\"{{ false }}\">\n                            <button sc-camel-on-click=\"{{ l.basculerDoublon }}\" title=\"Cet athlète existe déjà : compléter sa fiche ou ignorer la ligne\" style=\"margin-top:4px;padding:3px 8px;border-radius:6px;border:1px solid #DDD6C9;background:#FCFAF6;color:#6E675C;font-size:11px;cursor:pointer\">{{ l.libDoublon }}<\u002Fbutton>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                        <div style=\"font-size:13px;color:#4A443B\">{{ l.club }}<\u002Fdiv>\n                        <div style=\"font-size:13px;color:#4A443B\">{{ l.poids }}<\u002Fdiv>\n                        <div style=\"font-size:12px;color:#6E675C\">{{ l.tel }} / {{ l.urgence }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center\">\n                    <button sc-camel-on-click=\"{{ validerImport }}\" title=\"Écrit les lignes cochées dans la liste des athlètes\" style=\"padding:12px 20px;border-radius:10px;border:none;background:#0B9237;color:#FFFFFF;font-size:15px;font-weight:700;cursor:pointer\">Importer les {{ impNbGardees }} lignes cochées<\u002Fbutton>\n                    <div style=\"font-size:13px;color:#8A8378\">Le poids lu dans le fichier reste indicatif : la pesée du jour J fait foi.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ impResume }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px\">\n                    <div style=\"background:#FCFAF6;border:1px solid #E7E1D6;border-radius:11px;padding:14px\">\n                      <div style=\"font-size:26px;font-weight:700;color:#0B9237\">{{ resAjoutes }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#6E675C\">ajoutés<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"background:#FCFAF6;border:1px solid #E7E1D6;border-radius:11px;padding:14px\">\n                      <div style=\"font-size:26px;font-weight:700\">{{ resFusionnes }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#6E675C\">fiches complétées<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"background:#FCFAF6;border:1px solid #E7E1D6;border-radius:11px;padding:14px\">\n                      <div style=\"font-size:26px;font-weight:700;color:#8A8378\">{{ resIgnores }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#6E675C\">ignorés<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"background:#FCFAF6;border:1px solid #E7E1D6;border-radius:11px;padding:14px\">\n                      <div style=\"font-size:26px;font-weight:700;color:#EC6D23\">{{ resAVerifier }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#6E675C\">à vérifier<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n                    <button sc-camel-on-click=\"{{ fermerImport }}\" title=\"Rester sur la liste pour compléter les fiches\" style=\"padding:12px 20px;border-radius:10px;border:none;background:#0B9237;color:#FFFFFF;font-size:15px;font-weight:600;cursor:pointer\">Compléter les fiches<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ versPesee }}\" title=\"Passer à l'étape Pesée\" style=\"padding:12px 20px;border-radius:10px;border:1px solid #DDD6C9;background:#FCFAF6;color:#141210;font-size:15px;font-weight:500;cursor:pointer\">Aller à la pesée<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ annulerImport }}\" title=\"Revenir à la liste d'avant l'import\" style=\"margin-left:auto;padding:12px 18px;border-radius:10px;border:1px solid #E9CFC4;background:#FFFFFF;color:#A6371C;font-size:14px;font-weight:500;cursor:pointer\">Annuler cet import<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ photosOuvert }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#FFFFFF;border:2px solid #141210;border-radius:14px;padding:20px;margin-bottom:18px\">\n              <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:6px\">\n                <div style=\"font-size:18px;font-weight:700\">Correspondance des photos<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ fermerPhotos }}\" title=\"Abandonner cet import de photos\" style=\"margin-left:auto;padding:8px 13px;border-radius:9px;border:1px solid #DDD6C9;background:#FCFAF6;color:#6E675C;font-size:13px;cursor:pointer\">Fermer<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"font-size:13px;color:#6E675C;margin-bottom:14px\">Vérifiez à qui va chaque photo. Les photos sont recadrées en portrait automatiquement.<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ photosCorresp }}\" as=\"ph\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;gap:12px;align-items:center;padding:10px;border:1px solid #E7E1D6;border-radius:11px\">\n                    <div style=\"width:44px;height:54px;border-radius:7px;border:1px solid #DDD6C9;background-color:#F5F1E8;background-image:{{ ph.apercu }};background-size:cover;background-position:center;background-repeat:no-repeat;flex:none\"><\u002Fdiv>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font-size:13px;color:#6E675C\">{{ ph.nomFichier }}<\u002Fdiv>\n                      <sc-raw-select value=\"{{ ph.athleteId }}\" sc-camel-on-change=\"{{ ph.choisir }}\" title=\"À qui appartient cette photo ?\" style=\"width:100%;margin-top:5px;padding:9px 11px;border:1px solid #DDD6C9;border-radius:8px;background:#FCFAF6;font-size:14px;outline:none\">\n                        <option value=\"\">— Ne pas utiliser —<\u002Foption>\n                        <sc-for list=\"{{ athletesOptions }}\" as=\"ao\" hint-placeholder-count=\"6\">\n                          <option value=\"{{ ao.id }}\">{{ ao.nom }}<\u002Foption>\n                        <\u002Fsc-for>\n                      <\u002Fsc-raw-select>\n                    <\u002Fdiv>\n                    <div style=\"font-size:12px;font-weight:600;color:{{ ph.etatCouleur }};flex:none\">{{ ph.etat }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ appliquerPhotos }}\" title=\"Enregistre les photos sur les fiches désignées\" style=\"margin-top:14px;padding:12px 20px;border-radius:10px;border:none;background:#0B9237;color:#FFFFFF;font-size:15px;font-weight:600;cursor:pointer\">Appliquer les photos<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ msgAffectation }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-bottom:14px;padding:12px 15px;border-radius:11px;background:rgba(11,146,55,.07);border:1px solid rgba(11,146,55,.2);color:#03562A;font-size:13px;line-height:1.5;font-weight:600\">{{ msgAffectation }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ ilYaSansCategorie }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#FFF6E8;border:1px solid #F0D8B0;border-left:4px solid #E8A317;border-radius:12px;padding:16px 18px;margin-bottom:16px\">\n              <div style=\"font-size:15px;font-weight:700;color:#8A5A0B;margin-bottom:4px\">{{ nbSansCategorie }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:#8A5A0B;line-height:1.5;margin-bottom:12px;text-wrap:pretty\">Affectez-les à une catégorie existante, ou déclarez-les indépendants : ils concourent, leurs performances sont enregistrées, mais ils restent hors classement.<\u002Fdiv>\n\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#FFFFFF;border:1px solid #F0D8B0;border-radius:10px;padding:12px;margin-bottom:10px\">\n                <button sc-camel-on-click=\"{{ toutSelectionner }}\" title=\"Cocher tous les athlètes de cette liste\" style=\"padding:9px 13px;border-radius:8px;border:1px solid #DDD6C9;background:#FCFAF6;color:#141210;font-size:13px;font-weight:600;cursor:pointer\">Tout cocher<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ toutDeselectionner }}\" title=\"Décocher tout\" style=\"padding:9px 13px;border-radius:8px;border:1px solid #DDD6C9;background:#FFFFFF;color:#6E675C;font-size:13px;font-weight:500;cursor:pointer\">Tout décocher<\u002Fbutton>\n                <div style=\"font-size:13px;color:#8A8378;flex:none\">{{ libSelection }}<\u002Fdiv>\n                <sc-raw-select value=\"{{ choixGroupe }}\" sc-camel-on-change=\"{{ setChoixGroupe }}\" title=\"Catégorie d'arrivée pour les athlètes cochés\" style=\"flex:1;min-width:190px;padding:9px 11px;border:1px solid #DDD6C9;border-radius:8px;background:#FCFAF6;font-size:14px;outline:none\">\n                  <option value=\"\">Catégorie d'arrivée…<\u002Foption>\n                  <sc-for list=\"{{ categoriesOptions }}\" as=\"co\" hint-placeholder-count=\"2\">\n                    <option value=\"{{ co.id }}\">{{ co.nom }}<\u002Foption>\n                  <\u002Fsc-for>\n                  <option value=\"hors\">Indépendant — hors classement<\u002Foption>\n                <\u002Fsc-raw-select>\n                <button sc-camel-on-click=\"{{ affecterSelection }}\" title=\"Affecte tous les athlètes cochés à la catégorie choisie\" style=\"padding:10px 16px;border-radius:9px;border:none;background:#0B9237;color:#FFFFFF;font-size:14px;font-weight:700;cursor:pointer\">Affecter la sélection<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ repartirParPoids }}\" title=\"Classe les athlètes cochés (ou toute la liste si rien n'est coché) d'après le poids relevé à la pesée\" style=\"padding:10px 16px;border-radius:9px;border:1px solid #DDD6C9;background:#FFFFFF;color:#141210;font-size:14px;font-weight:600;cursor:pointer\">Classer d'après le poids pesé<\u002Fbutton>\n\n              <\u002Fdiv>\n              <sc-if value=\"{{ msgAffectation }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-bottom:10px;padding:10px 12px;border-radius:9px;background:#FFFFFF;border:1px solid #F0D8B0;color:#8A5A0B;font-size:13px;font-weight:600;line-height:1.45\">{{ msgAffectation }}<\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ sansCategorie }}\" as=\"s\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#FFFFFF;border:1px solid #F0D8B0;border-radius:10px;padding:10px 12px\">\n                    <button sc-camel-on-click=\"{{ s.basculerCoche }}\" title=\"Sélectionner cet athlète pour une affectation groupée\" style=\"width:26px;height:26px;border-radius:7px;border:1.5px solid {{ s.bordCoche }};background:{{ s.fondCoche }};color:#FFFFFF;font-size:14px;font-weight:700;cursor:pointer;flex:none;padding:0\">{{ s.libCoche }}<\u002Fbutton>\n                    <div style=\"flex:1;min-width:160px\">\n                      <div style=\"font-size:14px;font-weight:600\">{{ s.nom }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#8A8378\">{{ s.detail }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-raw-select value=\"{{ s.choix }}\" sc-camel-on-change=\"{{ s.setChoix }}\" title=\"Choisir la catégorie de cet athlète\" style=\"flex:none;min-width:200px;padding:9px 11px;border:1px solid #DDD6C9;border-radius:8px;background:#FCFAF6;font-size:14px;outline:none\">\n                      <option value=\"\">Affecter à…<\u002Foption>\n                      <sc-for list=\"{{ categoriesOptions }}\" as=\"co\" hint-placeholder-count=\"2\">\n                        <option value=\"{{ co.id }}\">{{ co.nom }}<\u002Foption>\n                      <\u002Fsc-for>\n                      <option value=\"hors\">Indépendant — hors classement<\u002Foption>\n                    <\u002Fsc-raw-select>\n                    <sc-if value=\"{{ s.erreur }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"flex:1 1 100%;padding:9px 11px;border-radius:8px;background:#FBEFEA;border:1px solid #E9CFC4;color:#A6371C;font-size:12px;font-weight:600;line-height:1.4\">{{ s.erreur }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ athletes }}\" as=\"a\" hint-placeholder-count=\"6\">\n              <div style=\"background:#FFFFFF;border:1px solid #E7E1D6;border-radius:12px;overflow:hidden\">\n                <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px\">\n                  <div style=\"width:36px;height:44px;border-radius:7px;border:1px solid #DDD6C9;background-color:#F5F1E8;background-image:{{ a.photoFond }};background-size:cover;background-position:center;background-repeat:no-repeat;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#8A8378;flex:none;overflow:hidden\">\n                    <sc-if value=\"{{ a.sansPhoto }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div>{{ a.initiales }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <input value=\"{{ a.dossardSaisi }}\" sc-camel-on-change=\"{{ a.setDossard }}\" placeholder=\"—\" title=\"Numéro de dossard, saisi à la main. L'ordre de passage de la première épreuve suit ces numéros, du plus petit au plus grand.\" style=\"width:52px;padding:7px 6px;border:1px solid #DDD6C9;border-radius:7px;background:#FCFAF6;font-size:15px;font-weight:700;text-align:center;color:#141210;flex:none;outline:none\">\n                  <button sc-camel-on-click=\"{{ a.suppr }}\" title=\"Supprimer cet athlète de la liste des engagés\" style=\"width:30px;height:30px;padding:0;border-radius:8px;border:1px solid #E9CFC4;background:#FFFFFF;color:#A6371C;font-size:15px;font-weight:700;cursor:pointer;flex:none\">✕<\u002Fbutton>\n                  <div style=\"flex:3 1 160px;min-width:0\">\n                    <div style=\"font-size:15px;font-weight:600;line-height:1.25\">{{ a.nomAffiche }}<\u002Fdiv>\n                    <div style=\"font-size:13px;color:#8A8378\">{{ a.clubAffiche }} · {{ a.groupeNom }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"display:flex;width:22px;height:15px;border:1px solid #DDD6C9;overflow:hidden;flex:none\">\n                    <span style=\"flex:1;background:{{ a.d1 }}\"><\u002Fspan>\n                    <span style=\"flex:1;background:{{ a.d2 }}\"><\u002Fspan>\n                    <span style=\"flex:1;background:{{ a.d3 }}\"><\u002Fspan>\n                  <\u002Fspan>\n                  <div style=\"flex:1 1 110px;min-width:96px;text-align:right\">\n                    <div style=\"font-size:12px;font-weight:60
